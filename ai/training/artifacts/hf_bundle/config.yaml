# ====================================================================
# Ultralytics YOLOv8 Exam Object Detection Configuration
# ====================================================================

# Dataset Paths (relative to training execution root or absolute)
path: /Users/srijan/aiproctor/ai/training/datasets/exam_objects
train: images/train
val: images/val
test: images/test

# Number of classes and label dictionary
nc: 5
names:
  0: cell_phone
  1: book
  2: paper_notes
  3: calculator
  4: secondary_screen

# Training Hyperparameters
hyperparameters:
  imgsz: 640
  batch: 8
  epochs: 5
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 1.0
  patience: 5
  optimizer: AdamW
  seed: 42
  deterministic: true

